name: CI
on:
  push:
    branches: [main, v2, ci-windows, copilot-prompts]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  # Runs the real Windows launcher building blocks on a real Windows machine.
  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: package-source.bat makes a clean zip
        shell: cmd
        run: |
          call package-source.bat "%RUNNER_TEMP%\src.zip"
          if errorlevel 1 exit /b 1
          if not exist "%RUNNER_TEMP%\src.zip" exit /b 1
          tar -tf "%RUNNER_TEMP%\src.zip" > "%RUNNER_TEMP%\list.txt"
          findstr /c:"start.bat" "%RUNNER_TEMP%\list.txt" || exit /b 1
          findstr /c:"redeploy.bat" "%RUNNER_TEMP%\list.txt" || exit /b 1
          findstr /c:"node_modules" "%RUNNER_TEMP%\list.txt" && exit /b 1
          exit /b 0

      - name: prompts file is present, CRLF, and copy command works
        shell: cmd
        run: |
          copy /y "TrialLens-Copilot-prompts.txt" "%RUNNER_TEMP%\prompts-copy.txt" >nul || exit /b 1
          findstr /c:"PROMPT 1" "%RUNNER_TEMP%\prompts-copy.txt" || exit /b 1
          findstr /c:"PROMPT 2" "%RUNNER_TEMP%\prompts-copy.txt" || exit /b 1
          findstr /i /c:"github.com" "%RUNNER_TEMP%\prompts-copy.txt" && exit /b 1
          exit /b 0

      - name: certutil hash line extraction (hashof)
        shell: cmd
        run: |
          set "H="
          for /f "delims=" %%h in ('certutil -hashfile "backend\requirements.txt" SHA256 2^>nul ^| findstr /r /i /c:"^[0-9a-f][0-9a-f ]*$"') do (
              if not defined H set "H=%%h"
          )
          echo hash=%H%
          if "%H%"=="" exit /b 1

      - name: install deps like start.bat does
        shell: cmd
        run: |
          python -m venv backend\.venv || exit /b 1
          backend\.venv\Scripts\python.exe -m pip install -q --disable-pip-version-check -r backend\requirements.txt || exit /b 1
          cd frontend
          call npm ci --no-audit --no-fund --silent || exit /b 1

      - name: start backend, probe port identity, stop (netstat + curl.exe patterns)
        shell: cmd
        run: |
          start "TrialLens Backend" /b cmd /c "cd /d backend && .venv\Scripts\python.exe -m uvicorn main:app --host 127.0.0.1 --port 8000"
          ping -n 13 127.0.0.1 >nul
          netstat -ano | findstr /r /c:":8000  *[^ ]*  *LISTENING" || exit /b 1
          curl.exe -s -m 3 "http://127.0.0.1:8000/health" | findstr /c:"triallens" || exit /b 1
          call stop.bat /q
          ping -n 4 127.0.0.1 >nul
          netstat -ano | findstr /r /c:":8000  *[^ ]*  *LISTENING" && exit /b 1
          exit /b 0

      - name: stop.bat leaves a foreign program on 8000 alone
        shell: cmd
        run: |
          start "other" /b python -m http.server 8000 --bind 127.0.0.1
          ping -n 5 127.0.0.1 >nul
          call stop.bat /q
          netstat -ano | findstr /r /c:":8000  *[^ ]*  *LISTENING" || exit /b 1
          exit /b 0

      - name: Vite dev server answers with the TrialLens title on 5173
        shell: cmd
        run: |
          cd frontend
          start "TrialLens Dashboard" /b cmd /c "npm run dev"
          ping -n 16 127.0.0.1 >nul
          curl.exe -s -m 3 "http://localhost:5173/" | findstr /i /c:"TrialLens" || exit /b 1
          exit /b 0
